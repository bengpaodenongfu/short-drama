name: Generate One Episode

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TOPIC: "修仙"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install specific moviepy version
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir pillow==10.0.0 moviepy==1.0.3 edge-tts python-docx requests

      - name: Verify imports
        run: |
          python -c "import moviepy; print('✅ moviepy')"
          python -c "from moviepy.editor import *; print('✅ moviepy.editor')"
          python -c "import PIL; print('✅ PIL')"
          python -c "import edge_tts; print('✅ edge_tts')"

      - name: Run script
        run: python short_drama.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: 短剧_第*.mp4
          if-no-files-found: ignore

      - name: Commit state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add drama_state.json
          git diff --staged --quiet || git commit -m "Update state"
          git push
