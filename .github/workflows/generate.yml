name: Generate One Episode

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TOPIC: "修仙"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pillow moviepy edge-tts python-docx requests

      - name: Run script
        run: python short_drama.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ env.EPISODE_NUM }}
          path: 短剧_第*.mp4
          if-no-files-found: ignore

      - name: Commit and push state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drama_state.json
          git diff --staged --quiet || git commit -m "Update drama state for episode ${{ env.EPISODE_NUM }}"
          git push
